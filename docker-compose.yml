version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sikka_postgres
    environment:
      POSTGRES_DB: sikka_exchange
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sikka_backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./.env:/root/.env:ro
      - ./test-ui:/test-ui:ro
      - /app/node_modules
    command: npm run dev
